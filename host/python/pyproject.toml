[project]
name = "imuninn"
version = "0.1.0"
description = "PC-side client for iMuninn: turn an iPhone into a network sensor node (camera, IMU, ARKit pose, LiDAR depth)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Jinqi Wei" }]
keywords = ["iphone", "sensor", "arkit", "lidar", "imu", "camera", "robotics", "protobuf", "mcap", "rerun"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Multimedia :: Video :: Capture",
  "Topic :: System :: Hardware",
]
dependencies = [
  "protobuf>=7.36",   # the committed bindings were generated by protoc 36.2 and require a matching runtime
  "websockets>=13",
  "zeroconf>=0.130",
  "numpy",
  "lz4>=4",
  "pyyaml>=6",
]

[project.optional-dependencies]
video = ["av>=12"]
mcap = ["mcap>=1.2", "mcap-protobuf-support>=0.5"]
rerun = ["rerun-sdk>=0.20", "av>=12"]
mcp = ["mcp>=2", "pillow"]
all = ["av>=12", "mcap>=1.2", "mcap-protobuf-support>=0.5", "rerun-sdk>=0.20", "mcp>=2", "pillow"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
docs = ["griffe==2.4.1"]  # tools/gen-docs.py only (needs Python 3.11+); pinned because docs/python/08-api.md is diffed in CI

[project.urls]
Homepage = "https://imuninn.projects.weijinqi.com"
Documentation = "https://imuninn.projects.weijinqi.com/python/"
Repository = "https://github.com/Bardreamaster/imuninn"
Issues = "https://github.com/Bardreamaster/imuninn/issues"
Changelog = "https://github.com/Bardreamaster/imuninn/releases"

[project.scripts]
imuninn = "imuninn.cli:main"
imuninn-mcp = "imuninn.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# src/imuninn/proto/ holds the generated protobuf bindings and a copy of imuninn.proto
# (both written by tools/gen-proto.sh and committed), so installs never need protoc and
# users / agents can read the message definitions from the installed package.
artifacts = ["src/imuninn/proto/*_pb2.py", "src/imuninn/proto/*_pb2.pyi", "src/imuninn/web_static/**"]  # web_static: built by tools/build-web.sh, not in git

[tool.hatch.build.targets.wheel]
packages = ["src/imuninn"]

[tool.hatch.build.targets.sdist]
include = ["src/imuninn", "tests", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
