name: python-release

# Tag `python-vX.Y.Z` -> build from host/python -> publish to PyPI (trusted publishing,
# no token). Manual runs publish to TestPyPI by default.
on:
  push:
    tags: ["python-v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/python-v')
        run: |
          tag="${GITHUB_REF_NAME#python-v}"
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          [ "$tag" = "$ver" ] || { echo "tag $tag != pyproject version $ver"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: host/web/package-lock.json
      - name: Build the browser viewer into the package
        run: ../../tools/build-web.sh && test -f src/imuninn/web_static/index.html
      - run: uv venv .venv && uv pip install -p .venv/bin/python -e ".[dev,mcap,video]" && .venv/bin/python -m pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: host/python/dist/

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/python-v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/python-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
