name: python-ci

on:
  push:
    branches: [main]
    paths: ["host/python/**", "protocol/**", "tools/gen-docs.py", "docs/python/0[78]-*.md", "docs/protocol/messages.md", ".github/workflows/python-ci.yml"]
  pull_request:
    paths: ["host/python/**", "protocol/**", "tools/gen-docs.py", "docs/python/0[78]-*.md", "docs/protocol/messages.md", ".github/workflows/python-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: host/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install -p .venv/bin/python -e ".[dev,mcap,video]" twine
      - name: Test
        run: python -m pytest -q
      - name: Build
        run: uv build
      - name: Check metadata
        run: python -m twine check dist/*

  generated-code:
    # The committed Python bindings and the .proto copy must match protocol/imuninn.proto.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-protoc@v3
        with:
          # Same protoc as the committed bindings (their header says "Protobuf Python Version: 7.36.2");
          # a different protoc writes a different version stamp and the diff would fail.
          version: "36.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Regenerate and diff
        run: |
          set -e
          out=$(mktemp -d)
          protoc -I protocol --python_out="$out" --pyi_out="$out" protocol/imuninn.proto
          diff -u host/python/src/imuninn/proto/imuninn_pb2.py "$out/imuninn_pb2.py"
          diff -u host/python/src/imuninn/proto/imuninn_pb2.pyi "$out/imuninn_pb2.pyi"
          diff -u protocol/imuninn.proto host/python/src/imuninn/proto/imuninn.proto
          grep -q "^$(cat protocol/VERSION)$" <(sed -n 's/^PROTOCOL_VERSION = //p' host/python/src/imuninn/__init__.py) \
            || { echo "PROTOCOL_VERSION in __init__.py does not match protocol/VERSION"; exit 1; }

  generated-docs:
    # docs/python/07-cli.md, 08-api.md and docs/protocol/messages.md are written by tools/gen-docs.py.
    # Python 3.13 like the machine that generates them: argparse help formatting differs between minors.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - run: uv venv .venv && uv pip install -p .venv/bin/python -e "host/python[docs]"
      - run: .venv/bin/python tools/gen-docs.py && git diff --exit-code -- docs/python/07-cli.md docs/python/08-api.md docs/protocol/messages.md
